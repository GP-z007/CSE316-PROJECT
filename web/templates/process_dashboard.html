  <style>
    :root { --bg:#0b0e14; --panel:#0e1219; --bar:#131720; --line:#1f242c; --text:#c9d1d9; --muted:#7d8590; --green:#40c977; --red:#e5534b; --amber:#d6a44b; --blue:#5997db; }
    * { box-sizing:border-box; } html,body { height:100vh; width:100vw; overflow:hidden; margin:0; padding:0; background:#0b0e14; color:#c9d1d9; font-family:'JetBrains Mono','Inter',monospace,sans-serif; font-size:12px; } button,input { font:inherit; } button { cursor:pointer; }

    .workspace { height:calc(100vh - 38px); display:grid; grid-template-columns:55% 45%; overflow:hidden; }.dock { min-width:0; min-height:0; }.left-dock { display:grid; grid-template-rows:70% 30%; border-right:1px solid var(--line); }.panel { min-width:0; min-height:0; overflow:hidden; background:var(--panel); border-bottom:1px solid var(--line); }.panel-head { height:26px; display:flex; align-items:center; justify-content:space-between; padding:0 7px; background:var(--bar); border-bottom:1px solid var(--line); color:#aeb8c4; font-size:10px; letter-spacing:.2px; }.panel-head .right { display:flex; gap:6px; align-items:center; }.badge { border:1px solid #2d3540; background:#10141a; padding:2px 4px; color:#8995a3; }.vnc-body { height:calc(100% - 26px); background:#000; }.vnc-body iframe { display:block; border:0; height:100%; width:100%; background:#000; }
    .bottom { display:grid; grid-template-rows:26px 1fr; }.tabs { height:26px; display:flex; align-items:stretch; background:var(--bar); border-bottom:1px solid var(--line); }.tab { border:0; border-right:1px solid var(--line); background:transparent; color:#788391; font-size:10px; padding:0 10px; }.tab.active { color:#d6dee7; background:#0e1219; border-top:1px solid var(--green); }.tab-content { min-height:0; }.timeline { display:grid; grid-template-columns:1fr 1fr; height:100%; gap:1px; background:var(--line); }.chart-wrap { position:relative; min-height:0; background:#0e1219; padding:4px 5px 2px; }.chart-label { position:absolute; top:6px; left:8px; color:#7f8b99; font-size:10px; pointer-events:none; }.chart-value { position:absolute; right:7px; top:6px; color:#c9d1d9; font-size:10px; }.chart { width:100%; height:100%; display:block; }.event-log { height:100%; overflow:auto; padding:5px 7px; color:#8e9aa8; line-height:17px; font-size:11px; }.log-time { color:#596473; }.log-ok { color:var(--green); }.log-warn { color:var(--amber); }.log-error { color:var(--red); }
    .right-dock { display:grid; grid-template-rows:26px 1fr 23px; overflow:hidden; }.process-head { justify-content:flex-start; gap:4px; overflow:hidden; }.head-spacer { flex:1; }.filter-btn.active,.sort-btn.active { color:#d9e2eb; border-color:#465363; background:#1b222d; }.process-scroll { overflow-y:auto; overflow-x:hidden; background:#0e1219; }.process-table { width:100%; border-collapse:collapse; table-layout:fixed; }.process-table thead th { position:sticky; top:0; z-index:2; height:24px; padding:0 5px; text-align:left; font-size:10px; font-weight:500; letter-spacing:.3px; color:#788391; background:#131720; border-bottom:1px solid var(--line); }.process-table tbody tr { height:26px; cursor:pointer; border-bottom:1px solid #171c24; border-left:3px solid #59616d; }.process-table tbody tr.running { border-left-color:var(--green); }.process-table tbody tr.cpu-hot { border-left-color:var(--red); }.process-table tbody tr.mem-hot { border-left-color:var(--amber); }.process-table tbody tr:hover { background:#161d27; }.process-table td { height:26px; padding:0 5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#c1cad3; }.process-table td.num { text-align:right; font-variant-numeric:tabular-nums; }.state { font-size:10px; }.state.run { color:var(--green); }.state.slp { color:#8492a1; }.state.zmb { color:var(--red); }.state.stp { color:var(--amber); }.cpu-cell { display:flex; align-items:center; justify-content:flex-end; gap:4px; }.mini-bar { width:25px; height:3px; background:#242b35; }.mini-bar i { display:block; height:100%; background:#5a92c8; }.cpu-hot .mini-bar i { background:var(--red); }.cmd { color:#9ca7b3; }.quick { opacity:0; display:flex; justify-content:flex-end; gap:2px; }.process-table tr:hover .quick { opacity:1; }.icon-action { height:18px; padding:0 3px; font-size:9px; }.icon-action.term { color:var(--amber); }.icon-action.kill { color:var(--red); }.icon-action.stop { color:var(--blue); }.table-foot { padding:4px 7px; background:#131720; border-top:1px solid var(--line); color:#737e8b; font-size:10px; }
    .modal-shade { position:fixed; inset:38px 0 0; display:none; z-index:10; background:rgba(0,0,0,.42); }.modal-shade.open { display:block; }.inspector { position:absolute; right:14px; top:14px; width:min(520px,calc(100vw - 28px)); background:#10151e; border:1px solid #36404d; box-shadow:0 18px 50px rgba(0,0,0,.65); }.inspect-head { height:30px; display:flex; align-items:center; justify-content:space-between; padding:0 8px; background:#171d27; border-bottom:1px solid var(--line); color:#d6dee7; }.close { background:none; border:0; color:#8b96a3; font-size:17px; }.inspect-body { padding:10px; }.detail-grid { display:grid; grid-template-columns:90px 1fr 90px 1fr; gap:7px 8px; align-items:center; }.detail-grid label { color:#788391; font-size:10px; }.metric-live { color:#e2e8ee; }.codebox { margin-top:9px; padding:7px; border:1px solid #27303b; background:#0a0d12; color:#afbbc7; word-break:break-all; line-height:16px; user-select:all; }.codebox:before { content:'FULL COMMAND LINE'; display:block; color:#687482; font-size:9px; margin-bottom:3px; }.controlbar { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:8px 10px; border-top:1px solid var(--line); background:#131820; }.control { height:27px; color:#e3e8ed; text-align:left; padding-left:8px; }.control.term { border-color:#725d35; color:#e4bb65; }.control.kill { border-color:#703b3b; color:#ee817a; }.control.stop { border-color:#385a7d; color:#80b1e8; }.control.resume { border-color:#35634a; color:#71d49a; } #toast-host { position:fixed; z-index:20; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }.toast { min-width:270px; max-width:390px; padding:8px 10px; border:1px solid #3a4552; border-left:3px solid var(--blue); background:#151b24; box-shadow:0 8px 25px rgba(0,0,0,.5); color:#cdd6df; animation:in .18s ease-out; }.toast.ok { border-left-color:var(--green); }.toast.err { border-left-color:var(--red); } @keyframes in { from { transform:translateY(8px); opacity:0; } } @media (max-width:960px) { .metrics { display:none; }.topbar { grid-template-columns:1fr 1fr; }.top-right { gap:3px; }.tool-btn { padding:0 4px; }.search { width:100px; }.detail-grid { grid-template-columns:75px 1fr; }.detail-grid label:nth-of-type(2) { grid-column:1; } }

<body>
  <header class="topbar"><div class="top-left"><i id="status-dot" class="dot" title="Poll status"></i><span id="node-label" class="node">NODE: lxd-ubuntu-01 | 10.10.10.10</span><span id="uptime" class="uptime">UP 00:00:00 · --ms</span></div><div class="metrics"><div class="metric"><label>CPU</label><strong id="cpu-readout">--.-%</strong><canvas class="spark" id="cpu-spark"></canvas></div><div class="metric"><label>RAM</label><strong id="ram-readout">-- / -- MB</strong><canvas class="spark" id="ram-spark"></canvas></div><div class="metric state-readout">RUN <b id="run-count">0</b> / SLP <b id="slp-count">0</b> / ZMB <b id="zmb-count">0</b> / STP <b id="stp-count">0</b></div></div><div class="top-right"><button class="tool-btn" id="reload-vnc">Reload VNC</button><button class="tool-btn" id="pop-vnc">Pop-out VNC</button><button class="tool-btn" id="pause-stream">Pause Stream</button><input id="process-search" class="search" autocomplete="off" placeholder="Filter processes  Ctrl+K"></div></header>
  <main class="workspace"><section class="dock left-dock"><section class="panel"><div class="panel-head"><span>DISPLAY :1 (KasmVNC)</span><span class="right"><span class="badge" id="resolution">REMOTE DISPLAY</span><button class="tool-btn" id="fullscreen-vnc">FULLSCREEN</button></span></div><div class="vnc-body"><iframe id="vnc-frame" src="{{ kasm_url }}" title="KasmVNC remote display" allow="fullscreen"></iframe></div></section><section class="panel bottom"><div class="tabs"><button class="tab active" data-tab="timeline">Resource Timeline</button><button class="tab" data-tab="log">Event &amp; Action Log</button></div><div class="tab-content" id="timeline-panel"><div class="timeline"><div class="chart-wrap"><span class="chart-label">CPU UTILIZATION %</span><span id="cpu-chart-value" class="chart-value">--.-%</span><canvas class="chart" id="cpu-chart"></canvas></div><div class="chart-wrap"><span class="chart-label">MEMORY UTILIZATION %</span><span id="mem-chart-value" class="chart-value">--.-%</span><canvas class="chart" id="mem-chart"></canvas></div></div></div><div class="tab-content event-log" id="log-panel" hidden></div></section></section><aside class="dock right-dock"><div class="panel-head process-head"><button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter="highcpu">High CPU &gt;30%</button><button class="filter-btn" data-filter="running">Running</button><button class="filter-btn" data-filter="zombies">Zombies</button><span class="head-spacer"></span><button class="sort-btn active" data-sort="cpu">CPU ▼</button><button class="sort-btn" data-sort="mem">MEM ▼</button><button class="sort-btn" data-sort="pid">PID</button></div><div class="process-scroll"><table class="process-table"><colgroup><col style="width:55px"><col style="width:66px"><col style="width:38px"><col style="width:76px"><col style="width:67px"><col><col style="width:83px"></colgroup><thead><tr><th>PID</th><th>USER</th><th>ST</th><th style="text-align:right">CPU%</th><th style="text-align:right">MEM MB</th><th>NAME / CMD</th><th></th></tr></thead><tbody id="process-body"></tbody></table></div><div class="table-foot"><span id="process-total">0 processes</span> · click a row to inspect and control</div></aside></main>
  <div class="modal-shade" id="modal-shade"><section class="inspector" role="dialog" aria-modal="true"><div class="inspect-head"><span>PROCESS INSPECTOR <b id="inspect-title"></b></span><button class="close" id="close-inspector" aria-label="Close">×</button></div><div class="inspect-body"><div class="detail-grid"><label>PID</label><span id="i-pid"></span><label>STATUS</label><span id="i-status"></span><label>NAME</label><span id="i-name"></span><label>USER</label><span id="i-user"></span><label>CPU</label><span class="metric-live" id="i-cpu"></span><label>MEMORY</label><span class="metric-live" id="i-memory"></span></div><div class="codebox" id="i-cmd"></div></div><div class="controlbar"><button class="control term" data-action="terminate">SIGTERM - Graceful Terminate</button><button class="control kill" data-action="kill">SIGKILL - Force Kill</button><button class="control stop" data-action="suspend">SIGSTOP - Freeze/Suspend Process</button><button class="control resume" data-action="resume">SIGCONT - Resume Process</button></div></section></div><div id="toast-host"></div>
  <script>
  (() => { const endpoint='/api/processes/', actionEndpoint='/api/manage_process/'; let processes=[],activeFilter='all',sort='cpu',selectedPid=null,paused=false,started=Date.now(),cpuHistory=[],memHistory=[],lastHigh=new Set(); const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function log(message,kind=''){const t=new Date().toLocaleTimeString('en-GB',{hour12:false});$('log-panel').insertAdjacentHTML('afterbegin',`<div><span class="log-time">[${t}]</span> <span class="${kind}">${message}</span></div>`)} function toast(message,type='ok'){const e=document.createElement('div');e.className='toast '+type;e.textContent=message;$('toast-host').append(e);setTimeout(()=>e.remove(),3600)} function status(ok,latency){$('status-dot').classList.toggle('online',ok);$('uptime').textContent=`UP ${new Date(Date.now()-started).toISOString().slice(11,19)} · ${ok?latency+'ms':'OFFLINE'}`} function shortState(s=''){s=s.toLowerCase();if(s.includes('zomb'))return['Z','zmb'];if(s.includes('stop')||s.includes('suspend'))return['T','stp'];if(s.includes('run'))return['R','run'];return['S','slp']}
    function draw(canvas,data,color,fill){const rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1,w=Math.max(1,rect.width),h=Math.max(1,rect.height);canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);c.strokeStyle='#161b22';c.lineWidth=1;for(let i=1;i<4;i++){let y=Math.round(h*i/4)+.5;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}if(!data.length)return;const pts=data.map((v,i)=>[i*Math.max(1,w/(Math.max(data.length-1,1))),h-(Math.min(100,Math.max(0,v))/100)*(h-8)-4]);c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.lineTo(w,h);c.lineTo(0,h);c.closePath();c.fillStyle=fill;c.fill();c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle=color;c.stroke()} function renderCharts(){draw($('cpu-chart'),cpuHistory,'#5b9bd5','rgba(91,155,213,.13)');draw($('mem-chart'),memHistory,'#c4964c','rgba(196,150,76,.13)');draw($('cpu-spark'),cpuHistory.slice(-30),'#5b9bd5','transparent');draw($('ram-spark'),memHistory.slice(-30),'#c4964c','transparent')}
    function renderTable(){const q=$('process-search').value.trim().toLowerCase();let list=processes.filter(p=>{const st=shortState(p.status)[1];return(!q||`${p.pid} ${p.name} ${p.username} ${p.cmdline||''}`.toLowerCase().includes(q))&&(activeFilter==='all'||activeFilter==='highcpu'&&+p.cpu_percent>30||activeFilter==='running'&&st==='run'||activeFilter==='zombies'&&st==='zmb')});list.sort((a,b)=>sort==='pid'?(+a.pid)-(+b.pid):sort==='mem'?(+b.memory_mb||0)-(+a.memory_mb||0):(+b.cpu_percent||0)-(+a.cpu_percent||0));$('process-total').textContent=`${list.length} / ${processes.length} processes`;$('process-body').innerHTML=list.map(p=>{const[letter,cls]=shortState(p.status),cpu=+p.cpu_percent||0,mem=+p.memory_percent||0,row=cpu>50?'cpu-hot':mem>20?'mem-hot':cls==='run'?'running':'';return `<tr class="${row}" data-pid="${esc(p.pid)}"><td>${esc(p.pid)}</td><td title="${esc(p.username)}">${esc(p.username||'?')}</td><td><span class="state ${cls}">${letter}</span></td><td class="num"><span class="cpu-cell">${cpu.toFixed(1)}<span class="mini-bar"><i style="width:${Math.min(cpu,100)}%"></i></span></span></td><td class="num">${(+p.memory_mb||0).toFixed(1)}</td><td class="cmd" title="${esc(p.cmdline||p.name)}">${esc(p.name||p.cmdline||'?')} <span>${esc(p.cmdline||'')}</span></td><td><span class="quick"><button class="icon-action term" data-quick="terminate">TERM</button><button class="icon-action kill" data-quick="kill">KILL</button><button class="icon-action stop" data-quick="suspend">STOP</button></span></td></tr>`}).join('')}
    function inspect(pid){selectedPid=+pid;const p=processes.find(x=>+x.pid===selectedPid);if(!p)return;const[letter,cls]=shortState(p.status);$('inspect-title').textContent=`/ ${p.pid}`;$('i-pid').textContent=p.pid;$('i-status').innerHTML=`<span class="state ${cls}">${letter} ${esc(p.status)}</span>`;$('i-name').textContent=p.name||'—';$('i-user').textContent=p.username||'—';$('i-cpu').textContent=`${(+p.cpu_percent||0).toFixed(2)} %`;$('i-memory').textContent=`${(+p.memory_mb||0).toFixed(2)} MB / ${(+p.memory_percent||0).toFixed(2)} %`;$('i-cmd').textContent=p.cmdline||p.name||'—';$('modal-shade').classList.add('open')}
    async function manage(action,pid=selectedPid){if(!pid)return;const fd=new FormData();fd.append('pid',pid);fd.append('action',action);try{const r=await fetch(actionEndpoint,{method:'POST',body:fd});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.message||d.error||`HTTP ${r.status}`);const label={terminate:'SIGTERM',kill:'SIGKILL',suspend:'SIGSTOP',resume:'SIGCONT'}[action];log(`${label} sent to PID ${pid}`,'log-warn');toast(`${label} dispatched to PID ${pid}`,'ok');$('modal-shade').classList.remove('open');poll()}catch(e){log(`ACTION FAILED PID ${pid}: ${e.message}`,'log-error');toast(`Action failed: ${e.message}`,'err')}}
    async function poll(){if(paused)return;const t=performance.now();try{const r=await fetch(endpoint,{cache:'no-store'}),data=await r.json();if(!r.ok||data.error)throw new Error(data.error||`HTTP ${r.status}`);status(true,Math.round(performance.now()-t));const s=data.system||{};processes=Array.isArray(data.processes)?data.processes:[];const cpu=+s.cpu_percent||0,mem=+s.memory_percent||0;cpuHistory.push(cpu);memHistory.push(mem);if(cpuHistory.length>90){cpuHistory.shift();memHistory.shift()}$('cpu-readout').textContent=cpu.toFixed(1)+'%';$('ram-readout').textContent=`${(+s.memory_used_mb||0).toFixed(0)} / ${(+s.memory_total_mb||0).toFixed(0)} MB`;$('cpu-chart-value').textContent=cpu.toFixed(1)+'%';$('mem-chart-value').textContent=mem.toFixed(1)+'%';const counts={run:0,slp:0,zmb:0,stp:0};processes.forEach(p=>counts[shortState(p.status)[1]]++);$('run-count').textContent=counts.run;$('slp-count').textContent=counts.slp;$('zmb-count').textContent=counts.zmb;$('stp-count').textContent=counts.stp;renderCharts();renderTable();if(selectedPid&&$('modal-shade').classList.contains('open'))inspect(selectedPid);const hot=new Set(processes.filter(p=>(+p.cpu_percent||0)>50).map(p=>p.pid));hot.forEach(pid=>{if(!lastHigh.has(pid))log(`HIGH CPU ALERT: PID ${pid} exceeds 50%`,'log-warn')});lastHigh=hot}catch(e){status(false);log(`API POLL FAILED: ${e.message}`,'log-error')}}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const is=b.dataset.tab==='timeline';$('timeline-panel').hidden=!is;$('log-panel').hidden=is});document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));renderTable()});document.querySelectorAll('.sort-btn').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('.sort-btn').forEach(x=>x.classList.toggle('active',x===b));renderTable()});$('process-search').oninput=renderTable;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('process-search').focus()}if(e.key==='Escape')$('modal-shade').classList.remove('open')});$('process-body').onclick=e=>{const row=e.target.closest('tr');if(!row)return;const quick=e.target.closest('[data-quick]');if(quick){e.stopPropagation();manage(quick.dataset.quick,+row.dataset.pid)}else inspect(row.dataset.pid)};$('close-inspector').onclick=()=>$('modal-shade').classList.remove('open');$('modal-shade').onclick=e=>{if(e.target===$('modal-shade'))$('modal-shade').classList.remove('open')};document.querySelectorAll('.control').forEach(b=>b.onclick=()=>manage(b.dataset.action));$('reload-vnc').onclick=()=>{$('vnc-frame').src=$('vnc-frame').src;toast('VNC display reloaded')};$('pop-vnc').onclick=()=>window.open($('vnc-frame').src,'kasmvnc','noopener,noreferrer');$('pause-stream').onclick=()=>{paused=!paused;$('pause-stream').textContent=paused?'Resume Stream':'Pause Stream';log(paused?'Telemetry stream paused':'Telemetry stream resumed','log-ok');if(!paused)poll()};$('fullscreen-vnc').onclick=()=>{$('vnc-frame').requestFullscreen?.()};window.addEventListener('resize',renderCharts);log('Telemetry workbench initialized','log-ok');poll();setInterval(poll,1500)
  })();
  </script>

      const vncUrl = 'https://192.168.64.35:8444/vnc.html?autoconnect=true&resize=scale&reconnect=true';
